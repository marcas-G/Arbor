name: Arbor CI

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: arbor-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  static:
    # Fast lane: everything that needs only the toolchain, no build
    # artifacts — lint, types, architecture boundaries, manifests and the
    # naming ratchet. ~4 minutes; failures localize here without waiting
    # for the long lanes.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve comparison base
        id: comparison_base
        shell: bash
        env:
          EVENT_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before || github.sha }}
        run: |
          base="$EVENT_BASE_SHA"
          if [[ "$base" =~ ^0+$ ]]; then
            base="$GITHUB_SHA"
          fi
          git cat-file -e "${base}^{commit}"
          echo "sha=$base" >> "$GITHUB_OUTPUT"

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.4.2

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 24.21.0
          cache: pnpm

      - name: Verify Linux runner storage
        run: node scripts/ci/verify-runner-storage.mjs

      - name: Prepare isolated local temp directory
        shell: bash
        run: |
          ci_tmp="$GITHUB_WORKSPACE/.ci-tmp"
          mkdir -p "$ci_tmp"
          chmod 700 "$ci_tmp"
          echo "TMPDIR=$ci_tmp" >> "$GITHUB_ENV"
          echo "TMP=$ci_tmp" >> "$GITHUB_ENV"
          echo "TEMP=$ci_tmp" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Architecture
        run: pnpm architecture

      - name: Manifest checks
        run: pnpm test:manifest

      - name: Semantic-naming transition gate
        run: node scripts/governance/check-semantic-naming.mjs --baseline "${{ steps.comparison_base.outputs.sha }}"

  unit:
    # Build once, then core tests + the source-size ratchet + coverage.
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve comparison base
        id: comparison_base
        shell: bash
        env:
          EVENT_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before || github.sha }}
        run: |
          base="$EVENT_BASE_SHA"
          if [[ "$base" =~ ^0+$ ]]; then
            base="$GITHUB_SHA"
          fi
          git cat-file -e "${base}^{commit}"
          echo "sha=$base" >> "$GITHUB_OUTPUT"

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.4.2

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 24.21.0
          cache: pnpm

      - name: Verify Linux runner storage
        run: node scripts/ci/verify-runner-storage.mjs

      - name: Prepare isolated local temp directory
        shell: bash
        run: |
          ci_tmp="$GITHUB_WORKSPACE/.ci-tmp"
          mkdir -p "$ci_tmp"
          chmod 700 "$ci_tmp"
          echo "TMPDIR=$ci_tmp" >> "$GITHUB_ENV"
          echo "TMP=$ci_tmp" >> "$GITHUB_ENV"
          echo "TEMP=$ci_tmp" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Core tests with coverage (single pass, plan PR 3)
        run: pnpm test:coverage

      - name: Source-size transition gate
        run: node scripts/governance/check-source-lines.mjs --baseline "${{ steps.comparison_base.outputs.sha }}"

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: arbor-coverage-${{ github.sha }}
          if-no-files-found: warn
          path: coverage/

  functional:
    # The daemon-boot release journey, sharded (plan PR 3): round-robin
    # over the sorted file list so heavy multi-restart families spread
    # evenly; each shard is an isolated runner and runs serially inside.
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    name: functional (${{ matrix.shard }}/6)
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.4.2

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 24.21.0
          cache: pnpm

      - name: Verify Linux runner storage
        run: node scripts/ci/verify-runner-storage.mjs

      - name: Prepare isolated local temp directory
        shell: bash
        run: |
          ci_tmp="$GITHUB_WORKSPACE/.ci-tmp/shard-${{ matrix.shard }}"
          mkdir -p "$ci_tmp"
          chmod 700 "$ci_tmp"
          echo "TMPDIR=$ci_tmp" >> "$GITHUB_ENV"
          echo "TMP=$ci_tmp" >> "$GITHUB_ENV"
          echo "TEMP=$ci_tmp" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Build web dist (daemon serves it; run-suite did this implicitly)
        run: pnpm --filter @arbor/web build

      - name: Install functional UI browser
        run: pnpm exec playwright install --with-deps chromium

      - name: Functional release journey (shard ${{ matrix.shard }}/6)
        run: |
          set -e
          mapfile -t FILES < <(node scripts/testing/functional-shard.mjs ${{ matrix.shard }} 6)
          echo "running ${#FILES[@]} files"
          pnpm vitest run "${FILES[@]}" --config vitest.functional.config.ts

  health:
    # Post-lane aggregation: audit + the health snapshot over the unit
    # lane's coverage artifact. Not a required check (skips are
    # ambiguous when an upstream lane fails); its verdict rides the
    # run summary and the uploaded snapshot.
    needs: [static, unit, functional]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.4.2

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 24.21.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download coverage
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: arbor-coverage-${{ github.sha }}
          path: coverage/

      - name: Dependency audit
        id: audit
        if: always()
        continue-on-error: true
        run: pnpm audit --audit-level high --json > audit.json

      - name: Health snapshot
        if: always()
        env:
          ARBOR_AUDIT_JSON: ${{ github.workspace }}/audit.json
          ARBOR_AUDIT_STATUS: ${{ steps.audit.outcome }}
          ARBOR_BASE_SHA: ${{ github.sha }}
        run: node scripts/ci/health-metrics.mjs --enforce > health-metrics.json

      - name: Upload health snapshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: arbor-health-${{ github.sha }}
          if-no-files-found: warn
          path: |
            health-metrics.json
            audit.json
