name: Arbor CI

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      runner_pool:
        description: Runner pool for a trusted manual qualification
        required: true
        default: hosted
        type: choice
        options:
          - hosted
          - local

concurrency:
  group: arbor-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

defaults:
  run:
    # Container jobs default to `sh`; several steps use bashisms (mapfile,
    # process substitution) and the repo's scripts assume bash.
    shell: bash

env:
  # Node tooling inside the job containers must reach their packages through
  # the host proxy; the runner forwards HTTP(S)_PROXY into the container.
  NODE_USE_ENV_PROXY: "1"
  PNPM_STORE_DIR: ${{ (github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && inputs.runner_pool != 'local')) && '/github/home/.local/share/pnpm/store' || '/pnpm-store' }}

jobs:
  plan:
    # CI campaign PR 5 — impact-analysis shadow mode. Generates the CI
    # Plan for the base..head diff (scripts/ci/plan.mjs, reusing the
    # checked impact map) and uploads it as an artifact. The plan NEVER
    # gates anything in this PR: every lane below still runs its
    # complete inventory; the functional lanes only report what
    # selection would have skipped in their step summaries. Planner
    # failures degrade to a conservative full-selection plan so lane
    # obligations never depend on this job's logic.
    runs-on: ${{ (github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && inputs.runner_pool != 'local')) && 'ubuntu-24.04' || 'arbor-ci' }}
    env:
      npm_config_store_dir: ${{ (github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && inputs.runner_pool != 'local')) && '/github/home/.local/share/pnpm/store' || '/pnpm-store' }}
    container:
      image: node:24.21.0-bookworm
      options: --user ${{ (github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && inputs.runner_pool != 'local')) && '1001:1001' || '1000:1000' }} --cpus=2 --memory=8g
      volumes:
        - arbor-pnpm-store:/pnpm-store
    timeout-minutes: 10
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Mark checkout safe for container user
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Resolve comparison base
        id: comparison_base
        shell: bash
        env:
          EVENT_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before || github.sha }}
        run: |
          base="$EVENT_BASE_SHA"
          if [[ "$base" =~ ^0+$ ]]; then
            base="$GITHUB_SHA"
          fi
          git cat-file -e "${base}^{commit}"
          echo "sha=$base" >> "$GITHUB_OUTPUT"

      - name: Generate CI plan
        env:
          BASE_SHA: ${{ steps.comparison_base.outputs.sha }}
        run: node scripts/ci/plan.mjs --base "$BASE_SHA" --head "$GITHUB_SHA" --output ci-plan.json

      - name: Plan summary
        if: always()
        continue-on-error: true
        run: node scripts/ci/plan.mjs --report ci-plan.json >> "$GITHUB_STEP_SUMMARY"

      - name: Upload CI plan
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: arbor-ci-plan-${{ github.sha }}
          path: ci-plan.json

  static:
    # Fast lane: everything that needs only the toolchain, no build
    # artifacts — lint, types, architecture boundaries, manifests and the
    # naming ratchet. ~4 minutes; failures localize here without waiting
    # for the long lanes.
    runs-on: ${{ (github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && inputs.runner_pool != 'local')) && 'ubuntu-24.04' || 'arbor-ci' }}
    env:
      npm_config_store_dir: ${{ (github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && inputs.runner_pool != 'local')) && '/github/home/.local/share/pnpm/store' || '/pnpm-store' }}
    container:
      image: node:24.21.0-bookworm
      options: --user ${{ (github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && inputs.runner_pool != 'local')) && '1001:1001' || '1000:1000' }} --cpus=2 --memory=8g
      volumes:
        - arbor-pnpm-store:/pnpm-store
    timeout-minutes: 20
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Mark checkout safe for container user
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Resolve comparison base
        id: comparison_base
        shell: bash
        env:
          EVENT_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before || github.sha }}
        run: |
          base="$EVENT_BASE_SHA"
          if [[ "$base" =~ ^0+$ ]]; then
            base="$GITHUB_SHA"
          fi
          git cat-file -e "${base}^{commit}"
          echo "sha=$base" >> "$GITHUB_OUTPUT"

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.4.2

      - name: Verify Linux runner storage
        run: node scripts/ci/verify-runner-storage.mjs

      - name: Prepare isolated local temp directory
        shell: bash
        run: |
          ci_tmp="$GITHUB_WORKSPACE/.ci-tmp"
          mkdir -p "$ci_tmp"
          chmod 700 "$ci_tmp"
          echo "TMPDIR=$ci_tmp" >> "$GITHUB_ENV"
          echo "TMP=$ci_tmp" >> "$GITHUB_ENV"
          echo "TEMP=$ci_tmp" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --store-dir "$PNPM_STORE_DIR"

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Architecture
        run: pnpm architecture

      - name: Manifest checks
        run: pnpm test:manifest

      - name: Semantic-naming transition gate
        run: node scripts/governance/check-semantic-naming.mjs --baseline "${{ steps.comparison_base.outputs.sha }}"

  unit:
    # Build once, then core tests + the source-size ratchet + coverage.
    runs-on: ${{ (github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && inputs.runner_pool != 'local')) && 'ubuntu-24.04' || 'arbor-ci' }}
    env:
      npm_config_store_dir: ${{ (github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && inputs.runner_pool != 'local')) && '/github/home/.local/share/pnpm/store' || '/pnpm-store' }}
    container:
      image: node:24.21.0-bookworm
      options: --user ${{ (github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && inputs.runner_pool != 'local')) && '1001:1001' || '1000:1000' }} --cpus=3 --memory=8g
      volumes:
        - arbor-pnpm-store:/pnpm-store
    timeout-minutes: 45
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Mark checkout safe for container user
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Resolve comparison base
        id: comparison_base
        shell: bash
        env:
          EVENT_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before || github.sha }}
        run: |
          base="$EVENT_BASE_SHA"
          if [[ "$base" =~ ^0+$ ]]; then
            base="$GITHUB_SHA"
          fi
          git cat-file -e "${base}^{commit}"
          echo "sha=$base" >> "$GITHUB_OUTPUT"

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.4.2

      - name: Verify Linux runner storage
        run: node scripts/ci/verify-runner-storage.mjs

      - name: Prepare isolated local temp directory
        shell: bash
        run: |
          ci_tmp="$GITHUB_WORKSPACE/.ci-tmp"
          mkdir -p "$ci_tmp"
          chmod 700 "$ci_tmp"
          echo "TMPDIR=$ci_tmp" >> "$GITHUB_ENV"
          echo "TMP=$ci_tmp" >> "$GITHUB_ENV"
          echo "TEMP=$ci_tmp" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --store-dir "$PNPM_STORE_DIR"

      - name: Build
        run: pnpm build

      - name: Core tests with coverage (single pass, plan PR 3)
        run: pnpm test:coverage

      - name: Source-size transition gate
        run: node scripts/governance/check-source-lines.mjs --baseline "${{ steps.comparison_base.outputs.sha }}"

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: arbor-coverage-${{ github.sha }}
          if-no-files-found: warn
          path: coverage/

  functional:
    # The daemon-boot release journey, sharded (plan PR 3): round-robin
    # over the sorted file list so heavy multi-restart families spread
    # evenly; each shard is an isolated runner and runs serially inside.
    # 8 shards x max-parallel 8 against the local runner pool. Measured on
    # this 32-core host: 12 concurrent shards oversubscribed the box (load
    # ~48) and daemon-startup/90s test timeouts produced false failures,
    # while 6-8 concurrent shards stay inside the CPU budget. The hosted
    # baseline measured 9-31 min per 6-way shard, so balance matters as
    # much as width.
    runs-on: ${{ (github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && inputs.runner_pool != 'local')) && 'ubuntu-24.04' || 'arbor-ci' }}
    env:
      npm_config_store_dir: ${{ (github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && inputs.runner_pool != 'local')) && '/github/home/.local/share/pnpm/store' || '/pnpm-store' }}
    container:
      image: node:24.21.0-bookworm
      # Functional shards run one test file at a time but each bootstraps a
      # daemon plus a web server and browser-less client: 3 cpus keeps the
      # shard under its standalone budget instead of starving its neighbours.
      options: --user ${{ (github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && inputs.runner_pool != 'local')) && '1001:1001' || '1000:1000' }} --cpus=3 --memory=8g
      volumes:
        - arbor-pnpm-store:/pnpm-store
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    name: functional (${{ matrix.shard }}/8)
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Mark checkout safe for container user
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.4.2

      - name: Verify Linux runner storage
        run: node scripts/ci/verify-runner-storage.mjs

      - name: Prepare isolated local temp directory
        shell: bash
        run: |
          ci_tmp="$GITHUB_WORKSPACE/.ci-tmp/shard-${{ matrix.shard }}"
          mkdir -p "$ci_tmp"
          chmod 700 "$ci_tmp"
          echo "TMPDIR=$ci_tmp" >> "$GITHUB_ENV"
          echo "TMP=$ci_tmp" >> "$GITHUB_ENV"
          echo "TEMP=$ci_tmp" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --store-dir "$PNPM_STORE_DIR"

      - name: Build
        run: pnpm build

      - name: Build web dist (daemon serves it; run-suite did this implicitly)
        run: pnpm --filter @arbor/web build

      - name: Download CI plan (shadow mode)
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: arbor-ci-plan-${{ github.sha }}

      - name: Report CI plan shadow summary (advisory only)
        continue-on-error: true
        run: |
          if [ ! -f ci-plan.json ]; then
            echo "CI plan artifact unavailable; shadow summary skipped (full shard still runs)." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          node scripts/ci/plan.mjs --report ci-plan.json --shard ${{ matrix.shard }}/8 >> "$GITHUB_STEP_SUMMARY"

      - name: Functional release journey (shard ${{ matrix.shard }}/8)
        run: |
          set -e
          mapfile -t FILES < <(node scripts/testing/functional-shard.mjs ${{ matrix.shard }} 8)
          echo "running ${#FILES[@]} files"
          pnpm vitest run "${FILES[@]}" --config tests/configs/vitest.functional.config.ts

  functional-ui:
    # The six Playwright browser specs. Kept out of the shards (which run
    # only .functional.test.ts and need no browser). The Microsoft apt
    # mirror 403s transiently on self-hosted runners — one retry.
    runs-on: ${{ (github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && inputs.runner_pool != 'local')) && 'ubuntu-24.04' || 'arbor-ci' }}
    env:
      npm_config_store_dir: ${{ (github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && inputs.runner_pool != 'local')) && '/github/home/.local/share/pnpm/store' || '/pnpm-store' }}
    container:
      # Locally built from node:24.21.0-bookworm + Chromium libs + the
      # 1.63.0 browser build (MCR pulls stall on this host); served by the
      # pool's local registry. Rebuild: actions-runner/ci-images.
      image: ${{ (github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && inputs.runner_pool != 'local')) && 'mcr.microsoft.com/playwright:v1.63.0-noble' || 'localhost:5000/arbor-ci/playwright:1.63.0' }}
      options: --user ${{ (github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && inputs.runner_pool != 'local')) && '1001:1001' || '1000:1000' }} --cpus=2 --memory=8g
      volumes:
        - arbor-pnpm-store:/pnpm-store
    timeout-minutes: 25
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Mark checkout safe for container user
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.4.2

      - name: Prepare isolated local temp directory
        shell: bash
        run: |
          ci_tmp="$GITHUB_WORKSPACE/.ci-tmp/ui"
          mkdir -p "$ci_tmp"
          chmod 700 "$ci_tmp"
          echo "TMPDIR=$ci_tmp" >> "$GITHUB_ENV"
          echo "TMP=$ci_tmp" >> "$GITHUB_ENV"
          echo "TEMP=$ci_tmp" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --store-dir "$PNPM_STORE_DIR"

      - name: Build
        run: pnpm build

      - name: Build web dist
        run: pnpm --filter @arbor/web build

      - name: Download CI plan (shadow mode)
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: arbor-ci-plan-${{ github.sha }}

      - name: Report CI plan shadow summary (advisory only)
        continue-on-error: true
        run: |
          if [ ! -f ci-plan.json ]; then
            echo "CI plan artifact unavailable; shadow summary skipped (full browser suite still runs)." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          node scripts/ci/plan.mjs --report ci-plan.json --check functional-ui >> "$GITHUB_STEP_SUMMARY"

      - name: Functional UI journey
        run: pnpm test:functional:ui

  web:
    # Independent web verification: root Vitest excludes apps/web, so the
    # web package needs its own typecheck, build and unit-test lane.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.4.2

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 24.21.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build workspace packages
        run: pnpm build

      - name: Web typecheck
        run: pnpm --filter @arbor/web typecheck

      - name: Web build
        run: pnpm --filter @arbor/web build

      - name: Web unit tests
        run: pnpm --filter @arbor/web test

  health:
    # Post-lane aggregation: audit + the health snapshot over the unit
    # lane's coverage artifact. Not a required check (skips are
    # ambiguous when an upstream lane fails); its verdict rides the
    # run summary and the uploaded snapshot.
    needs: [static, unit, functional, functional-ui, web]
    if: always()
    runs-on: ${{ (github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && inputs.runner_pool != 'local')) && 'ubuntu-24.04' || 'arbor-ci' }}
    env:
      npm_config_store_dir: ${{ (github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && inputs.runner_pool != 'local')) && '/github/home/.local/share/pnpm/store' || '/pnpm-store' }}
    container:
      image: node:24.21.0-bookworm
      options: --user ${{ (github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && inputs.runner_pool != 'local')) && '1001:1001' || '1000:1000' }} --cpus=2 --memory=8g
      volumes:
        - arbor-pnpm-store:/pnpm-store
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Mark checkout safe for container user
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.4.2

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --store-dir "$PNPM_STORE_DIR"

      - name: Download coverage
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: arbor-coverage-${{ github.sha }}
          path: coverage/

      - name: Dependency audit
        id: audit
        if: always()
        continue-on-error: true
        run: pnpm audit --audit-level high --json > audit.json

      - name: Health snapshot
        if: always()
        env:
          ARBOR_AUDIT_JSON: ${{ github.workspace }}/audit.json
          ARBOR_AUDIT_STATUS: ${{ steps.audit.outcome }}
          ARBOR_BASE_SHA: ${{ github.sha }}
        run: node scripts/ci/health-metrics.mjs --enforce > health-metrics.json

      - name: Upload health snapshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: arbor-health-${{ github.sha }}
          if-no-files-found: warn
          path: |
            health-metrics.json
            audit.json
